<div class="modal-container">
  <button
    mat-icon-button
    class="close-btn"
    type="button"
    aria-label="Fechar janela do e-book"
    title="Fechar"
    (click)="closeModal()"
  >
    <span class="close-glyph" aria-hidden="true"></span>
  </button>

  <div class="modal-content">
    <div class="image-container">
      <span class="image-badge">E-book gratuito</span>
      <img
        src="assets/ebook.png"
        alt="Capa do e-book 10 Curiosidades Nerd que Todo Mundo Deveria Saber"
        class="ebook-image"
      />
    </div>

    <div class="text-container">
      <span class="modal-eyebrow">Arquivo secreto do universo nerd</span>
      <h1 class="title">10 Curiosidades Nerd que Todo Mundo Deveria Saber</h1>
      <p class="description">
        Explore curiosidades sobre filmes, séries e animes, com bastidores e fatos
        que conectam ficção e realidade em uma leitura rápida e divertida.
      </p>

      <div class="modal-actions">
        <button mat-flat-button class="download-btn" type="button" (click)="downloadEbook()">
          <span>Baixar E-book</span>
          <span aria-hidden="true">↓</span>
        </button>
        <span class="download-note">PDF gratuito · download imediato</span>
      </div>
    </div>
  </div>
</div>
