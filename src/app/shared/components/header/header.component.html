<mat-toolbar class="toolbar desktop-toolbar" *ngIf="!isMobile">
  <div class="nav-shell">
    <a class="brand" href="/" aria-label="Ir para o início do Oráculo Nerd">
      <img src="assets/oraculo_logo.png" alt="Oráculo Nerd" />
    </a>

    <nav class="nav-links" aria-label="Links do Oráculo Nerd">
      <a href="https://www.youtube.com/@oficialoraculo" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://www.instagram.com/_oraculonerd/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://open.spotify.com/playlist/6Wsa6VHwhtVhr1oiBdatcw?si=9dd29bbfa24842f0" target="_blank" rel="noopener noreferrer">Spotify</a>
    </nav>

    <button mat-button class="ebook-btn" (click)="startDownload()">
      Baixar E-book
      <span aria-hidden="true">↗</span>
    </button>
  </div>
</mat-toolbar>

<mat-toolbar class="toolbar mobile-toolbar" *ngIf="isMobile">
  <button mat-button class="menu-trigger" [matMenuTriggerFor]="menu" aria-label="Abrir menu">
    <mat-icon>menu</mat-icon>
  </button>

  <a class="mobile-brand" href="/">
    <img src="assets/oraculo_logo.png" alt="Oráculo Nerd" />
  </a>

  <span class="mobile-spacer"></span>

  <button mat-button class="ebook-btn ebook-btn--mobile" (click)="startDownload()">E-book</button>
</mat-toolbar>

<mat-menu #menu="matMenu">
  <a mat-menu-item href="https://www.youtube.com/@oficialoraculo" target="_blank" rel="noopener noreferrer">YouTube</a>
  <a mat-menu-item href="https://www.instagram.com/_oraculonerd/" target="_blank" rel="noopener noreferrer">Instagram</a>
  <a mat-menu-item href="https://open.spotify.com/playlist/6Wsa6VHwhtVhr1oiBdatcw?si=9dd29bbfa24842f0" target="_blank" rel="noopener noreferrer">Spotify</a>
</mat-menu>

<div *ngIf="showSpinner" class="download-overlay">
  <mat-spinner diameter="96"></mat-spinner>
</div>
