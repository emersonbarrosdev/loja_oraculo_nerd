<mat-card class="product-card">
  <div class="product-image-wrap">
    <img mat-card-image [src]="project?.image" [alt]="project?.title || 'Produto Oráculo Nerd'" loading="lazy" />
  </div>

  <div class="product-info">
    <mat-card-title
      [matTooltip]="project?.title.length > 45 ? project?.title : null"
      [matTooltipPosition]="'above'"
    >
      {{ project?.title | truncate : 45 }}
    </mat-card-title>

    <mat-card-content>
      <p
        [matTooltip]="project?.description.length > 90 ? project?.description : null"
        [matTooltipPosition]="'above'"
      >
        {{ project?.description | truncate : 90 }}
      </p>
    </mat-card-content>

    <mat-card-actions>
      <a class="buy-link" [href]="project?.link" target="_blank" rel="noopener noreferrer">
        <button mat-raised-button class="buy-button">Ver produto</button>
      </a>
    </mat-card-actions>
  </div>
</mat-card>
